version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nutriai-db
    environment:
      POSTGRES_DB: nutriai
      POSTGRES_USER: nutriai_user
      POSTGRES_PASSWORD: nutriai_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/src/db/seed-foods.sql:/docker-entrypoint-initdb.d/02-seed-foods.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutriai_user -d nutriai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: nutriai-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://nutriai_user:nutriai_pass@postgres:5432/nutriai
      JWT_SECRET: ${JWT_SECRET:-nutriai-dev-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-nutriai-dev-refresh-secret-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AIzaSyAaYhGafGPJTEkZUG7BGzFM3JZfONnB3KA}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174,http://localhost:8081}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
